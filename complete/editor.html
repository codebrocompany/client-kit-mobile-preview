<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111110">
  <title>Template Editor — Client Kit</title>
  <link rel="stylesheet" href="style.css">
  <script src="../vendor/html2canvas.min.js" data-kit-capture defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="editor">
  <div class="editor-toolbar" role="toolbar" aria-label="Document tools">
    <a class="back-link" href="../index.html">← <span>Template Library</span></a>
    <div class="toolbar-actions"><button id="logo-button" class="tool-button" type="button">Add logo</button><button id="add-section-button" class="tool-button" type="button">+ Section</button><button id="reset-button" class="tool-button muted-button" type="button">Reset</button><button id="theme-button" class="tool-button muted-button" type="button" aria-pressed="false">Light mode</button><button id="save-button" class="tool-button" type="button">Save Edits ↓</button><button id="pdf-button" class="tool-button primary-button" type="button">Save as PDF</button><button id="png-button" class="tool-button primary-button" type="button">Save as PNG</button></div>
  </div>
  <input id="logo-input" type="file" accept="image/png,image/jpeg,image/webp" hidden aria-label="Choose company logo">
  <main class="editor-shell">
    <div class="editor-intro"><p class="eyebrow gold">THE CLIENT KIT</p><p>Tap a value to edit it. Headings stay fixed; use + Section or + Field to add your own content.</p></div>
    <article id="document" class="document" aria-live="polite"></article>
    <p class="editor-note">Template content is a starting point. Review every detail before sharing with a client. Agreements should be reviewed by a qualified professional for your use case.</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
