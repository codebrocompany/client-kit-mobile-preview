*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}.library-shell{max-width:1020px;margin:auto;padding:40px 40px 28px}.library-header{padding-bottom:42px}.brand{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.08em}.brand-mark{display:grid;place-items:center;width:29px;height:29px;border:1px solid var(--gold);border-radius:4px;color:var(--gold);font-size:10px}.brand-muted{color:var(--dim);font-weight:650}.header-rule{height:1px;background:var(--line);margin:33px 0 38px}.eyebrow,.section-heading,.card-top,.card-foot,.collection-meta,.guide-grid>div>span,.site-footer{font-size:10px;font-weight:750;letter-spacing:.17em}.eyebrow{color:var(--muted);margin:0 0 12px}.gold,.gold-dot{color:var(--gold)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(36px,6vw,63px);letter-spacing:-.055em;line-height:1.03;margin-bottom:16px}h2{font-size:inherit}h3{letter-spacing:-.03em}.intro{max-width:720px;color:var(--muted);font-size:16px;line-height:1.65}.facts{display:flex;flex-wrap:wrap;gap:13px 31px;margin-top:23px;color:var(--muted);font-size:12px}.facts span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);vertical-align:middle;margin-right:9px}.library-section{margin-bottom:45px}.section-heading{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);color:var(--dim);padding:0 0 12px;margin-bottom:16px}.section-heading h2{margin:0;font-size:10px;letter-spacing:inherit;font-weight:inherit}.section-heading h2 span{color:var(--gold)}.starter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.starter-card{display:flex;flex-direction:column;min-height:190px;padding:24px;border:1px solid var(--line);border-radius:5px;background:var(--panel);transition:transform .2s,border-color .2s,background .2s}.starter-card:hover,.collection-item:hover{transform:translateY(-3px);border-color:var(--gold);background:var(--panel2)}.card-top{display:flex;align-items:center;justify-content:space-between;color:var(--dim);margin-bottom:17px}.pill{border:1px solid #54715a;background:#1b2b1d;color:var(--green);border-radius:2px;padding:4px 8px;font-size:9px}.starter-card strong{font-size:17px}.starter-card p{color:var(--muted);font-size:13px;line-height:1.55;margin:6px 0 17px}.card-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;color:var(--gold);letter-spacing:.08em}.card-foot span{font-size:16px;line-height:0}.collection-panel{padding:31px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}.collection-copy{max-width:700px}.collection-copy h3{font-size:clamp(22px,3vw,32px);margin-bottom:8px}.collection-copy>p:last-child{color:var(--muted);max-width:630px;line-height:1.6;font-size:14px}.collection-meta{display:flex;gap:18px;color:var(--gold);margin:21px 0 25px;letter-spacing:.09em}.collection-meta span+span{color:var(--dim)}.collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.collection-item{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:13px 14px;background:var(--bg);border:1px solid var(--line);border-radius:3px;font-size:12px;transition:transform .2s,border-color .2s,background .2s}.collection-item span{color:var(--gold);font-size:10px}.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.guide-grid>div{padding:23px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}.guide-grid>div>span{color:var(--gold)}.guide-grid h3{font-size:16px;margin:12px 0 8px}.guide-grid p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.site-footer{display:flex;justify-content:space-between;gap:20px;padding-top:25px;border-top:1px solid var(--line);color:var(--dim);font-size:10px;letter-spacing:.06em}
.editor-toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px max(20px,calc((100vw - 1020px)/2 + 40px));border-bottom:1px solid var(--line);background:#111110ed;backdrop-filter:blur(12px)}.back-link{font-size:12px;font-weight:700;white-space:nowrap;color:var(--gold)}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.tool-button{border:1px solid var(--line);border-radius:3px;padding:9px 12px;background:var(--panel2);color:var(--text);font-size:11px;font-weight:700;white-space:nowrap}.tool-button:hover{border-color:var(--gold)}.primary-button{background:var(--gold);color:#1c170c;border-color:var(--gold)}.muted-button{color:var(--muted)}.editor-shell{max-width:860px;margin:0 auto;padding:30px 25px 70px}.editor-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.editor-intro p:last-child{color:var(--muted);font-size:12px;margin:0}.document{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:clamp(25px,6vw,65px);color:var(--paper-ink);min-height:800px}.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:27px;border-bottom:2px solid var(--gold)}.doc-brand{font-size:12px;font-weight:850;letter-spacing:.1em}.doc-brand small{display:block;color:var(--paper-sub);font-size:10px;letter-spacing:.05em;font-weight:550;margin-top:4px}.doc-label{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.14em;text-align:right}.doc-title{font-size:clamp(29px,5vw,46px);line-height:1.04;letter-spacing:-.055em;margin:38px 0 8px}.doc-description{color:var(--paper-sub);font-size:13px;max-width:590px;margin-bottom:31px}.doc-section{position:relative;border-top:1px solid var(--line);padding:22px 0 25px}.doc-section h2{font-size:10px;letter-spacing:.16em;color:var(--gold);margin:0 0 15px}.doc-section p{font-size:13px;line-height:1.65;color:var(--paper-ink);margin-bottom:10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 24px}.field label{display:block;color:var(--paper-sub);font-size:9px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}.editable{display:block;min-height:23px;padding:2px 2px 4px;border-bottom:1px dashed #a98745;color:var(--paper-ink);font-size:13px;line-height:1.5;overflow-wrap:anywhere}.editable:focus{border-bottom-style:solid;background:#d5af5820;outline:none}.editable:empty::before{content:attr(data-placeholder);color:var(--paper-sub)}.editable.inline{display:inline;min-height:0}.doc-table{width:100%;border-collapse:collapse;font-size:12px}.doc-table th{text-align:left;color:var(--paper-sub);text-transform:uppercase;font-size:9px;letter-spacing:.1em;font-weight:750;padding:9px 5px;border-bottom:1px solid var(--line)}.doc-table td{padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:top}.doc-table .editable{min-width:45px}.doc-table .numeric{text-align:right}.table-scroll{overflow:auto}.total-row{display:flex;align-items:center;justify-content:flex-end;gap:20px;font-size:13px;padding-top:16px}.total-row strong{font-size:17px;color:var(--gold)}.remove-button{position:absolute;right:0;top:15px;border:1px solid var(--line);background:var(--panel2);color:var(--paper-sub);border-radius:2px;width:25px;height:25px;opacity:0;transition:opacity .15s}.doc-section:hover .remove-button,.remove-button:focus-visible{opacity:1}.doc-footer{border-top:2px solid var(--gold);padding-top:18px;margin-top:25px;display:flex;justify-content:space-between;gap:20px;color:var(--paper-sub);font-size:10px}.editor-note{color:var(--muted);font-size:11px;line-height:1.6;margin:16px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:var(--gold);color:#1d180e;border-radius:3px;padding:9px 15px;font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
body.light{--bg:#eef1f3;--panel:#fff;--panel2:#f7f8f9;--line:#cbd2d8;--text:#161a1d;--muted:#46515a;--dim:#626d76;--gold:#745515;--gold2:#8b691e;--paper:#fff;--paper-ink:#161a1d;--paper-sub:#46515a;--shadow:0 18px 48px #2637461c;color-scheme:light}body.light .editor-toolbar{background:#eef1f3f2}body.light .primary-button{background:#745515;color:#fff;border-color:#745515}body.light .pill{color:#38543f;background:#e4f2e5;border-color:#b8d5bd}
@media(max-width:700px){.library-shell{padding:25px 20px}.header-rule{margin:24px 0 28px}.library-header{padding-bottom:32px}.starter-grid,.guide-grid{grid-template-columns:1fr}.starter-card{min-height:175px}.collection-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.collection-panel{padding:22px}.editor-toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{width:100%;justify-content:space-between}.toolbar-actions .tool-button{flex:1}.editor-intro{display:block}.editor-intro p:last-child{margin-top:6px}.doc-head{flex-direction:column}.doc-label{text-align:left}.fields{grid-template-columns:1fr}.site-footer{display:block}.site-footer span{display:block;margin:5px 0}}@media(max-width:410px){.collection-grid{grid-template-columns:1fr}.facts{gap:9px 16px}.tool-button{font-size:10px;padding:8px}.editor-shell{padding:20px 12px 60px}.document{padding:23px}.doc-table{font-size:10px}}
@media print{@page{size:auto;margin:12mm}html,body{background:#fff!important;color:#161a1d!important;color-scheme:light!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}body{--bg:#fff;--panel:#fff;--panel2:#fff;--line:#cbd2d8;--text:#161a1d;--muted:#46515a;--dim:#626d76;--gold:#745515;--paper:#fff;--paper-ink:#161a1d;--paper-sub:#46515a;--shadow:none}.editor-toolbar,.editor-intro,.editor-note,.toast,.remove-button{display:none!important}.editor-shell{max-width:none;padding:0;margin:0}.document{border:0;box-shadow:none;background:#fff!important;color:#161a1d!important;min-height:0;padding:0}.doc-section{break-inside:auto}.doc-section h2{break-after:avoid}.doc-table tr,.field,.doc-footer{break-inside:avoid}.table-scroll{overflow:visible}.doc-footer{margin-top:12px}a{color:#161a1d}}
.doc-brand>.editable,.doc-brand small .editable,.doc-title .editable,.doc-description .editable,.doc-section h2 .editable,.field label .editable,.doc-table th .editable,.doc-footer .editable,.total-row .editable{display:inline;min-height:0;padding:0;border-bottom:1px dashed #a98745;font:inherit;color:inherit;letter-spacing:inherit;line-height:inherit;text-transform:inherit}
.doc-description .editable,.doc-section p>.editable{white-space:pre-wrap}
.doc-table th:last-child,.doc-table td.row-action{width:28px;text-align:right}

.remove-row:hover,.remove-row:focus-visible{color:var(--gold)}

.add-row:hover{border-color:var(--gold)}

    {title:"Cancellation",paragraphs:["Either party may cancel in writing. Specify deposit treatment, payment for completed work, approved non-cancellable expenses, and any notice period here: [CANCELLATION TERMS]."]},

  "package-menu": {name:"Package Menu", category:"Complete collection", description:"Show prospective clients clear options without inventing a fixed quote.", sections:[
    {title:"Introduction",fields:[["Prepared for","[CLIENT / AUDIENCE]"],["Date","[DATE]"]],paragraphs:["These example packages show possible ways to work together. Final scope, timeline, and price are confirmed in a tailored proposal."]},
    {title:"Options",table:{headers:["Option","Best for","Includes","Price"],rows:[["Essential","[USE CASE]","[DELIVERABLES]","[CUSTOM QUOTE]"],["Growth","[USE CASE]","[DELIVERABLES]","[CUSTOM QUOTE]"],["Custom","[USE CASE]","[DELIVERABLES]","[CUSTOM QUOTE]"]]}},
    {title:"How we scope",bullets:["Discovery call to understand users and business goals","Written project brief and delivery milestones","Proposal with assumptions, exclusions, and payment schedule","Approval before work begins"]},
    {title:"Next step",fields:[["Contact","[YOUR CONTACT]"],["Discovery call","[DATE / LINK]"]]}
  ]},
  "b-roll-checklist": {name:"B-Roll Checklist", category:"Complete collection", description:"Plan the supporting shots that make a product story feel real.", sections:[
    {title:"Shoot details",fields:[["Project / campaign","[NAME]"],["Shoot date","[DATE]"],["Location","[LOCATION]"],["Creative lead","[NAME]"]]},
    {title:"Shot list",table:{headers:["Shot","Purpose","Owner","Done"],rows:[["Workspace wide shot","[CONTEXT]","[NAME]","□"],["Hands using the product","[DEMONSTRATION]","[NAME]","□"],["Close-up detail","[FEATURE]","[NAME]","□"],["Team interaction","[PROCESS]","[NAME]","□"],["Client environment","[AUTHENTICITY]","[NAME]","□"]]}},
    {title:"Production check",bullets:["Location access and permissions confirmed","Devices charged and storage cleared","Brand props and product build ready","Audio, lighting, and backup gear checked","Release/consent requirements confirmed"]},
    {title:"Delivery",fields:[["Footage location","[FOLDER / LINK]"],["Editor handoff","[DATE]"],["Missing shots","[NONE OR LIST]"]]}
  ]}
};

const collectionIds = ["agreement-full","invoice-full","welcome-doc","discovery-call","project-brief","task-list","delivery-guide","monthly-report","thank-you-doc","feedback-request","package-menu","b-roll-checklist"];

function invoiceSections(full){
  const result=[
    {title:"Invoice details",fields:[["Invoice number","[INV-001]"],["Issue date","[DD Month YYYY]"],["Due date","[DD Month YYYY]"],["Payment terms","[DUE ON RECEIPT / NET 7]"],["Currency symbol","₹"]]},
    {title:"From",fields:[["Your name","[YOUR FULL NAME]"],["Business name","[YOUR BUSINESS NAME]"],["Email","[YOUR EMAIL]"],["Phone","[YOUR PHONE]"]]},
    {title:"Bill to",fields:[["Client name","[CLIENT NAME]"],["Client business","[CLIENT BUSINESS]"],["Client email","[CLIENT EMAIL]"],["Client phone","[CLIENT PHONE]"],["Billing address","[CLIENT ADDRESS]"],["Project / reference","[PROJECT NAME]"]]},
    {title:"Services & fees",invoice:true},
    {title:"Payment instructions",fields:[["Bank name","[BANK NAME]"],["Account name","[ACCOUNT NAME]"],["Account number / UPI","[ACCOUNT OR UPI]"],["Routing / IFSC","[ROUTING OR IFSC]"],["Payment reference","[INVOICE NUMBER]"],["Accepted methods","[BANK TRANSFER / OTHER]"],["Payment link","[OPTIONAL PAYMENT LINK]"]]},
    {title:"Notes",paragraphs:["Thank you for your business. Please include the invoice number with your payment. For questions about this invoice, contact [EMAIL]."]}
  ];
  if(full) result.splice(5,0,{title:"Milestone & tax details",fields:[["Milestone","[MILESTONE NAME]"],["Purchase order","[PO NUMBER OR N/A]"],["Tax ID / GSTIN","[IF APPLICABLE]"],["Tax treatment","[REVIEW WITH ACCOUNTANT]"]]});
  return result;
}

const $=(selector,root=document)=>root.querySelector(selector);
const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
function editable(value,className=""){const node=el("span",`editable ${className}`.trim(),value);node.contentEditable="true";node.spellcheck=true;node.setAttribute("role","textbox");node.setAttribute("aria-label",value.startsWith("[")?value.replace(/[\[\]]/g,""):"Editable text");return node}
function textBlock(value){const p=el("p");p.append(editable(value));return p}
function makeSection(data){const section=el("section","doc-section"),heading=el("h2");heading.append(editable(data.title));section.append(heading);const remove=el("button","remove-button","×");remove.type="button";remove.setAttribute("aria-label",`Remove ${data.title} section`);remove.title="Remove section (use Undo to restore)";section.append(remove);
  if(data.fields){const grid=el("div","fields");for(const [label,value] of data.fields){const field=el("div","field"),caption=el("label");caption.append(editable(label));field.append(caption,editable(value));grid.append(field)}section.append(grid)}
  if(data.paragraphs)for(const paragraph of data.paragraphs)section.append(textBlock(paragraph));
  if(data.bullets){const list=el("div","bullet-list");for(const bullet of data.bullets){const line=el("p");line.append(editable(`— ${bullet}`,"inline"));list.append(line)}section.append(list)}
  if(data.table){const wrap=el("div","table-scroll"),table=el("table","doc-table"),thead=el("thead"),headRow=el("tr");for(const heading of data.table.headers){const th=el("th");th.append(editable(heading));headRow.append(th)}thead.append(headRow);table.append(thead);const body=el("tbody");for(const row of data.table.rows){const tr=el("tr");for(const cell of row){const td=el("td");td.append(editable(cell));tr.append(td)}body.append(tr)}table.append(body);wrap.append(table);section.append(wrap)}
  if(data.invoice)section.append(makeInvoiceTable());return section}
function makeInvoiceRow(description="[SERVICE OR MILESTONE]",qty="1",rate="0"){const row=el("tr");for(const [index,value] of [description,qty,rate,"0.00"].entries()){const td=el("td",index===3?"numeric":""),field=editable(value);if(index===1)field.classList.add("qty");if(index===2)field.classList.add("rate");if(index===3)field.classList.add("line-amount");td.append(field);row.append(td)}const action=el("td","row-action"),remove=el("button","remove-row","×");remove.type="button";remove.setAttribute("aria-label","Remove service row");action.append(remove);row.append(action);return row}
function makeInvoiceTable(){const wrap=el("div","table-scroll"),table=el("table","doc-table invoice-table"),thead=el("thead"),headRow=el("tr");for(const heading of ["Description","Qty","Rate","Amount",""]){const th=el("th");if(heading)th.append(editable(heading));headRow.append(th)}thead.append(headRow);table.append(thead);const tbody=el("tbody");for(let i=0;i<3;i++)tbody.append(makeInvoiceRow());table.append(tbody);wrap.append(table);const add=el("button","add-row","+ Add service");add.type="button";wrap.append(add);const tax=el("div","invoice-tax field"),label=el("label");label.append(editable("Tax rate (%)"));tax.append(label,editable("0","tax-rate"));const totals=el("div","invoice-totals");for(const [name,cls] of [["Subtotal","subtotal"],["Tax","tax-amount"],["Total due","total-due"]]){const row=el("div","total-row"),caption=el("span"),amount=el("strong");caption.append(editable(name));amount.append(editable("0.00",cls));row.append(caption,amount);totals.append(row)}wrap.append(tax,totals);return wrap}
function numberFromText(value){const number=parseFloat(String(value).replace(/[^0-9.,-]/g,"").replace(/,/g,""));return Number.isFinite(number)?number:0}
function updateTotalFromTax(){const subtotal=numberFromText($(".subtotal")?.textContent),tax=numberFromText($(".tax-amount")?.textContent);$(".total-due").textContent=(subtotal+tax).toFixed(2)}
function updateTotalsFromSubtotal(){const subtotal=numberFromText($(".subtotal")?.textContent),taxRate=numberFromText($(".tax-rate")?.textContent),tax=subtotal*taxRate/100;$(".tax-amount").textContent=tax.toFixed(2);$(".total-due").textContent=(subtotal+tax).toFixed(2)}
function updateTotalsFromAmounts(){const table=$(".invoice-table");if(!table)return;let subtotal=0;for(const row of table.tBodies[0].rows)subtotal+=numberFromText($(".line-amount",row).textContent);$(".subtotal").textContent=subtotal.toFixed(2);updateTotalsFromSubtotal()}
function updateRowAmount(row){const qty=numberFromText($(".qty",row).textContent),rate=numberFromText($(".rate",row).textContent);$(".line-amount",row).textContent=(qty*rate).toFixed(2)}
function updateTotals(){const table=$(".invoice-table");if(!table)return;for(const row of table.tBodies[0].rows)updateRowAmount(row);updateTotalsFromAmounts()}
function renderLibrary(){const grid=$("#collection-grid");for(const [index,id] of collectionIds.entries()){const link=el("a","collection-item");link.href=`editor.html?template=${id}`;link.append(el("span","",String(index+1).padStart(2,"0")),document.createTextNode(details[id].name),el("span","","↗"));grid.append(link)}}
function renderEditor(){const id=new URLSearchParams(location.search).get("template")||document.body.dataset.template||"welcome-doc",data=details[id],root=$("#document");if(!data){root.append(el("h1","","Template not found"),textBlock("Return to the library and choose a document."));return}document.title=`${data.name} — Client Kit`;root.dataset.template=id;const head=el("header","doc-head"),brand=el("div","doc-brand");brand.append(editable("[YOUR BUSINESS NAME]"),el("small"));$("small",brand).append(editable("[YOUR SERVICE / NICHE]"));head.append(brand,editable("CLIENT DOCUMENT","doc-label"));const title=el("h1","doc-title"),description=el("p","doc-description");title.append(editable(data.name));description.append(editable(data.description));root.append(head,title,description);for(const section of data.sections)root.append(makeSection(section));const foot=el("footer","doc-footer");foot.append(editable("[YOUR BUSINESS NAME] — Confidential"),editable("Prepared for [CLIENT NAME] · [DATE]"));root.append(foot);wireEditor();}
const removedSections=[];
function wireEditor(){const root=$("#document"),id=root.dataset.template;if(document.body.dataset.page==="editor")updateTotals();root.addEventListener("input",event=>{const target=event.target;if(target.matches(".qty,.rate")){updateRowAmount(target.closest("tr"));updateTotalsFromAmounts()}else if(target.matches(".tax-rate,.subtotal"))updateTotalsFromSubtotal();else if(target.matches(".line-amount"))updateTotalsFromAmounts();else if(target.matches(".tax-amount"))updateTotalFromTax()});root.addEventListener("click",event=>{const add=event.target.closest(".add-row"),removeRow=event.target.closest(".remove-row"),removeSection=event.target.closest(".remove-button");if(add){$(".invoice-table tbody").append(makeInvoiceRow());updateTotalsFromAmounts();toast("Service row added.")}else if(removeRow){const row=removeRow.closest("tr");removedSections.push({parent:row.parentNode,next:row.nextSibling,node:row});row.remove();updateTotalsFromAmounts();toast("Service row removed. Use Undo to restore it.")}else if(removeSection){const section=removeSection.closest(".doc-section");removedSections.push({parent:section.parentNode,next:section.nextSibling,node:section});section.remove();updateTotalsFromAmounts();toast("Section removed. Use Undo to restore it.")}});
  $("#undo-button")?.addEventListener("click",undoRemoval);document.addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="z"&&!event.target.closest?.("[contenteditable=true]")){if(removedSections.length){event.preventDefault();undoRemoval()}}});
  $("#theme-button")?.addEventListener("click",()=>{document.body.classList.toggle("light");const light=document.body.classList.contains("light");$("#theme-button").textContent=light?"Dark mode":"Light mode";$("#theme-button").setAttribute("aria-pressed",String(light));try{localStorage.setItem("client-kit-theme",light?"light":"dark")}catch(error){}});
  $("#pdf-button")?.addEventListener("click",()=>window.print());$("#reset-button")?.addEventListener("click",()=>{if(confirm("Reset this document to the starting template? Your unsaved edits will be lost."))location.reload()});$("#save-button")?.addEventListener("click",()=>saveStandalone(document.title.replace(" — Client Kit",""),id));}
function undoRemoval(){const entry=removedSections.pop();if(!entry){toast("Nothing to restore.");return}entry.parent.insertBefore(entry.node,entry.next?.parentNode===entry.parent?entry.next:null);updateTotalsFromAmounts();toast("Restored.")}
function toast(message){const bar=$("#toast");if(!bar)return;bar.textContent=message;bar.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>bar.classList.remove("show"),3200)}
async function saveStandalone(name,id){try{const inlineCss=$("style[data-kit-style]");const css=inlineCss?inlineCss.textContent:await fetch("style.css").then(r=>{if(!r.ok)throw Error("Could not load styling");return r.text()});const inlineJs=$("script[data-kit-runtime]");const js=inlineJs?inlineJs.textContent:await fetch("app.js").then(r=>{if(!r.ok)throw Error("Could not load editor script");return r.text()});const clone=$("#document").cloneNode(true);clone.querySelectorAll(".editable").forEach(n=>{n.textContent=n.textContent;n.contentEditable="true"});const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtml(name)} — Code Bro Client Kit</title><style data-kit-style>${css.replace(/<\/style/gi,"<\\/style")}</style></head><body data-page="standalone"${document.body.classList.contains("light")?' class="light"':''}><div class="editor-toolbar" role="toolbar" aria-label="Document tools"><span class="back-link">CODE BRO / CLIENT KIT</span><div class="toolbar-actions"><button id="undo-button" class="tool-button muted-button" type="button">Undo remove</button><button id="theme-button" class="tool-button muted-button" type="button">${document.body.classList.contains("light")?"Dark mode":"Light mode"}</button><button id="save-button" class="tool-button" type="button">Save Edits ↓</button><button id="pdf-button" class="tool-button primary-button" type="button">Save as PDF</button></div></div><main class="editor-shell"><article id="document" class="document" data-template="${escapeHtml(id)}">${clone.innerHTML}</article></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script data-kit-runtime>${js.replace(/<\/script/gi,"<\\/script")}<\/script></body></html>`;
    const finalHtml=html.replaceAll("Code Bro Client Kit","Client Kit").replaceAll("CODE BRO / CLIENT KIT","THE CLIENT KIT");
    const url=URL.createObjectURL(new Blob([finalHtml],{type:"text/html"})),link=el("a");link.href=url;link.download=`client-kit-${id}-edited.html`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Editable HTML downloaded.")
  }catch(error){toast("Save failed. Please try again.");console.error(error)}}
function escapeHtml(text){return text.replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char])}
if(document.body.dataset.page==="library")renderLibrary();if(document.body.dataset.page==="editor"){try{if(localStorage.getItem("client-kit-theme")==="light")document.body.classList.add("light")}catch(error){}const themeButton=$("#theme-button");if(themeButton){const light=document.body.classList.contains("light");themeButton.textContent=light?"Dark mode":"Light mode";themeButton.setAttribute("aria-pressed",String(light))}renderEditor()}if(document.body.dataset.page==="standalone")wireEditor();
</script>
